# 服务分组。改完这个文件后：sudo docker restart homepage（或页面右下角刷新按钮）
# icon：本仓库图标用 /icons/xxx.png（自托管，见 icons/ 目录，不依赖 CDN）；也可用 dashboard-icons 名字 / mdi-xxx / si-xxx
# siteMonitor 会让页面显示在线小圆点（由 homepage 容器发起请求）
# container + server 会让页面显示容器状态，点击状态可看 CPU/内存/网络

